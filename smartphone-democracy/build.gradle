buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.google.dagger:hilt-android-gradle-plugin:$dagger_version")
    }
}

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id "androidx.navigation.safeargs.kotlin"
    id "com.google.devtools.ksp" version "2.1.10-1.0.29"
    id 'org.jetbrains.kotlin.plugin.serialization'
    id("org.jetbrains.kotlin.plugin.compose") version "2.1.10"
}
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'kotlinx-serialization'

repositories {
    mavenCentral()
    google()
    mavenLocal()
    maven {
        url = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
        mavenContent { snapshotsOnly() }
    }
}

android {
    namespace 'nl.tudelft.trustchain.smartphonedemocracy'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildFeatures {
        viewBinding = true
        compose = true
    }

    packagingOptions {
        resources {
            excludes += 'META-INF/kotlinx-coroutines-core.kotlin_module'
            excludes += '**/log4j2.propertyMapping.json'
            excludes += '*/log4j2.propertyMapping.json'
            excludes += 'log4j2.propertyMapping.json'
            excludes += 'log4j2*'
        }
    }
}

dependencies {
    // Project dependencies
    implementation project(':common')
    implementation project(':rustlibs')
    api(project(':ipv8')) {
        exclude module: 'lazysodium-java'
    }
    implementation project(':ipv8-android')

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.01.01')
    implementation(composeBom)
    testImplementation(composeBom)
    androidTestImplementation(composeBom)
    
    implementation 'androidx.compose.material3:material3-android'
    implementation "androidx.compose.material3:material3"
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.material3.adaptive:adaptive")
    implementation("androidx.compose.runtime:runtime-livedata")
    implementation("androidx.compose.runtime:runtime-rxjava2")
    implementation "androidx.navigation:navigation-compose:2.8.6"
    debugImplementation("androidx.compose.ui:ui-tooling")

    // Activity
    implementation("androidx.activity:activity-compose:1.9.3")

    // Room
    api "androidx.room:room-runtime:$room_version"
    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")

    // Hilt
    api "com.google.dagger:hilt-android:$dagger_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation 'androidx.hilt:hilt-navigation-fragment:1.2.0'
    ksp "com.google.dagger:hilt-android-compiler:$dagger_version"

    // Crypto & Serialization
    api 'org.bouncycastle:bcprov-jdk15to18:1.68'

    implementation("io.github.andrewquijano:ciphercraft:1.0.4") {
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
    }
    runtimeOnly 'com.celeral:log4j2-android:1.0.0'

    implementation 'com.google.code.gson:gson:2.12.1'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0")
    implementation 'com.google.crypto.tink:tink-android:1.7.0'  // For additional crypto primitives

    // Networking
    implementation("io.ktor:ktor-client-core:3.1.0")
    implementation("io.ktor:ktor-client-okhttp:3.1.0")
    implementation("io.ktor:ktor-client-content-negotiation:3.1.0")
    implementation("io.ktor:ktor-serialization-gson:3.1.0")

    // Logging
//    implementation 'io.github.oshai:kotlin-logging-jvm:6.0.3'
//    implementation 'org.slf4j:slf4j-android:1.7.36'

    // Testing
    testImplementation "junit:junit:$junit_version"
    testImplementation 'org.mockito:mockito-core:4.5.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:4.1.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
    androidTestImplementation "androidx.test.ext:junit:$android_junit_version"
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-test-manifest")


}